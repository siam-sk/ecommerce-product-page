<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce Product Page</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header class="header">
        <div class="logo-nav">
            <div class="logo">
                <img src="./assets/logo/logo.svg" alt="sneaker-logo">
            </div>
            <div class="nav">
                <ul>
                    <li><a href="#">Collections</a></li>
                    <li><a href="#">Man</a></li>
                    <li><a href="">Women</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </div>
        </div>
        <div class="cart-avatar">
            <div class="cart">
                <a href="#"><i class="fa-solid fa-cart-shopping"></i></a>
            </div>
            <div class="avatar">
                <img src="./assets/img/image-avatar.png" alt="avatar">
            </div>
        </div>
    </header>
    <main class="main">
        <div>
            <div class="product-images">
                <div class="main-image">
                    <img src="./assets/img/image-product-1.jpg" alt="product-image">
                </div>
                <div class="thumbnails">
                    <div class="first-thumbnail">
                        <img src="./assets/img/image-product-1-thumbnail.jpg" alt="image-product-1-thumbnail">
                    </div>
                    <div>
                        <img src="./assets/img/image-product-2-thumbnail.jpg" alt="image-product-2-thumbnail">
                    </div>
                    <div>
                        <img src="./assets/img/image-product-3-thumbnail.jpg" alt="image-product-3-thumbnail">
                    </div>
                    <div>
                        <img src="./assets/img/image-product-4-thumbnail.jpg" alt="image-product-4-thumbnail">
                    </div>
                </div>
            </div>
        </div>
        <div class="product-description">
                <h3>Sneaker Company</h3>
                <h1>Fall Limited Edition Sneakers</h1>
                <p>These low-profile sneakers are your perfect casual wear companion. Featuring a durable ruber outer sole, they'll withstand everything the weather can offer.</p>
                <div class="discount-price">
                    <p>&dollar;125.00</p>
                    <span class="discount">50%</span>
                </div>
                <div class="price">
                    <p><del>&dollar;250.00</del></p>
                </div>
                <div class="add-cart">
                    <div class="quantity">
                    <button><i class="fa-solid fa-plus"></i></button>
                    <p>0</p>
                    <button><i class="fa-solid fa-minus"></i></button>
                    </div>
                    <div class="add-to-cart">
                        <i class="fa-solid fa-cart-plus"></i>
                        <p>Add to cart</p>
                    </div>
                </div>
        </div>
    </main>
</body>
</html>
